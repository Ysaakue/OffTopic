name: voice_core
description: Dart client for the OffTopic native voice core (C++ through dart:ffi).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

resolution: workspace

dependencies:
  equatable: ^3.0.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
