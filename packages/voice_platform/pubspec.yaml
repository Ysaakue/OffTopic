name: voice_platform
description: Typed platform services for OffTopic (foreground service, audio route, Wi-Fi) through Pigeon.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

resolution: workspace

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^29.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.isaacgeraldo.offtopic.voiceplatform
        pluginClass: VoicePlatformPlugin
      ios:
        pluginClass: VoicePlatformPlugin
